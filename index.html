<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ceyline Holdings (Pvt) Ltd &mdash; Roots for the Future</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500&family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <canvas id="canopy-canvas"></canvas>
  <div class="scrim"></div>

  <div class="controls">
    <div class="pill-group" role="group" aria-label="Sound">
      <button type="button" id="btn-sound" aria-pressed="false" title="Nature sounds">&#128266;</button>
    </div>
    <div class="pill-group" role="group" aria-label="Theme">
      <button type="button" id="btn-light" aria-pressed="false" title="Light mode">&#9728;</button>
      <button type="button" id="btn-dark" aria-pressed="false" title="Dark mode">&#9789;</button>
      <button type="button" id="btn-system" aria-pressed="true" title="Match system">&#9881;</button>
    </div>
  </div>

  <main>
    <div class="brand">
      <div class="brand-name">Ceyline Holdings (Pvt) Ltd</div>
      <div class="brand-tag">Roots for the Future</div>
    </div>

    <div class="gate" id="gate">
      <button type="button" class="start-btn" id="start-btn">Click to begin</button>
    </div>

    <div class="ring-wrap" id="ring-wrap" hidden>
      <svg viewBox="0 0 120 120">
        <circle class="ring-track" cx="60" cy="60" r="52"></circle>
        <circle class="ring-progress" id="ring" cx="60" cy="60" r="52"
          stroke-dasharray="326.7" stroke-dashoffset="0"></circle>
      </svg>
      <div class="count" id="count">10</div>
    </div>

    <div class="visually-hidden" id="status" role="status" aria-live="polite"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
